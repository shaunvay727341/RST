name: Publish Android Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - apk-distribution/app-debug.apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Validate and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate prebuilt debug APK and checksum
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="apk-distribution/app-debug.apk"
          CHECKSUM_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Missing prebuilt APK at $APK_PATH"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK file at $APK_PATH is empty"
            exit 1
          fi

          if [ ! -f "$CHECKSUM_PATH" ]; then
            echo "::error::Missing checksum file at $CHECKSUM_PATH"
            exit 1
          fi

          EXPECTED_SHA256="$(awk '{print $1}' "$CHECKSUM_PATH" | tr -d '[:space:]')"
          ACTUAL_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"

          if [ -z "$EXPECTED_SHA256" ] || [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "::error::SHA-256 mismatch! Expected: $EXPECTED_SHA256, Actual: $ACTUAL_SHA256"
            exit 1
          fi

          unzip -tq "$APK_PATH"

          APK_BYTES="$(wc -c < "$APK_PATH" | tr -d '[:space:]')"
          APK_HUMAN="$(du -h "$APK_PATH" | awk '{print $1}')"

          echo "sha256=$ACTUAL_SHA256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_human=$APK_HUMAN" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          {
            echo "Prebuilt debug APK published from \`apk-distribution/app-debug.apk\`."
            echo ""
            echo "- **SHA-256:** \`${{ steps.validate.outputs.sha256 }}\`"
            echo "- **Size:** ${{ steps.validate.outputs.size_human }} (${{ steps.validate.outputs.size_bytes }} bytes)"
          } > /tmp/release-notes.md

          gh release create "$TAG" "apk-distribution/app-debug.apk#app-debug.apk" \
            --repo "${{ github.repository }}" \
            --title "Android Debug APK (${TAG})" \
            --notes-file /tmp/release-notes.md \
            --latest

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "direct_url=$DIRECT_URL" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Debug APK Release Published"
            echo ""
            echo "- **Release Tag:** \`${{ steps.release.outputs.tag }}\`"
            echo "- **APK Size:** ${{ steps.validate.outputs.size_human }} (${{ steps.validate.outputs.size_bytes }} bytes)"
            echo "- **SHA-256:** \`${{ steps.validate.outputs.sha256 }}\`"
            echo "- **GitHub Release Page:** ${{ steps.release.outputs.release_url }}"
            echo "- **Direct Latest APK Download URL:** ${{ steps.release.outputs.direct_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
